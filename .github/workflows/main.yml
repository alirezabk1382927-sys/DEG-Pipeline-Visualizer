name: Build and Release DEG Pipeline

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: 

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DEG_Pipeline_Windows.exe
            asset_name: DEG_Pipeline_Windows
            sep: ";"
            icon_arg: "--icon=icon.png" 
          - os: ubuntu-latest
            artifact_name: DEG_Pipeline_Linux
            asset_name: DEG_Pipeline_Linux
            sep: ":"
            icon_arg: "--icon=icon.png"
          - os: macos-latest
            artifact_name: DEG_Pipeline_macOS
            asset_name: DEG_Pipeline_macOS
            sep: ":"
            icon_arg: "--icon=icon.png" 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcursor-dev libxi-dev libxext-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # نصب کتابخانه‌های مورد نیاز برنامه شما
          pip install pandas numpy matplotlib seaborn adjustText pydeseq2 customtkinter Pillow

      - name: Build Executable with PyInstaller
        run: |
          # در این بخش فایل‌های icon.png و icon.ico به همراه برنامه باندل می‌شوند
          # تا هم برای لوگوی داخل برنامه (png) و هم نشانک (ico) در دسترس باشند.
          pyinstaller --noconfirm --onefile --windowed ${{ matrix.icon_arg }} --add-data "icon.png${{ matrix.sep }}." --add-data "icon.ico${{ matrix.sep }}." --name "${{ matrix.artifact_name }}" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DEG_Pipeline_Windows/DEG_Pipeline_Windows.exe
            artifacts/DEG_Pipeline_Linux/DEG_Pipeline_Linux
            artifacts/DEG_Pipeline_macOS/DEG_Pipeline_macOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
