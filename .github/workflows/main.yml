name: Build DEG Pipeline Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Tk dependency
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Convert PNG icon for macOS (icns)
        if: matrix.platform == 'macos'
        run: |
          mkdir icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          cp icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      # ---------- Build ----------
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name DEG_Pipeline `
            --icon icon.png `
            --add-data "icon.png;." `
            deg_pipeline.py

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name DEG_Pipeline `
            --icon icon.icns `
            --add-data "icon.png:." `
            deg_pipeline.py

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --noconfirm --onefile `
            --name DEG_Pipeline `
            --icon icon.png `
            --add-data "icon.png:." `
            deg_pipeline.py

      # ---------- Rename output so the OS is obvious ----------
      - name: Rename output (Windows)
        if: matrix.platform == 'windows'
        run: |
          Move-Item -Path "dist/DEG_Pipeline.exe" -Destination "dist/DEG_Pipeline-Windows-x64.exe"

      - name: Rename & zip output (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          if [ -d "DEG_Pipeline.app" ]; then
            mv DEG_Pipeline.app "DEG_Pipeline-macOS.app"
            zip -r "DEG_Pipeline-macOS.zip" "DEG_Pipeline-macOS.app"
          elif [ -f "DEG_Pipeline" ]; then
            mv DEG_Pipeline "DEG_Pipeline-macOS"
            zip -r "DEG_Pipeline-macOS.zip" "DEG_Pipeline-macOS"
          fi
        continue-on-error: false

      - name: Rename output (Linux)
        if: matrix.platform == 'linux'
        run: |
          mv dist/DEG_Pipeline dist/DEG_Pipeline-Linux-x64

      # ---------- Upload ----------
      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: DEG_Pipeline-Windows-x64
          path: dist/DEG_Pipeline-Windows-x64.exe

      - name: Upload artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: DEG_Pipeline-macOS
          path: dist/DEG_Pipeline-macOS.zip

      - name: Upload artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: DEG_Pipeline-Linux-x64
          path: dist/DEG_Pipeline-Linux-x64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
